<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="VILUNA Joyería">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5D87A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icono diamante -->
  <polygon points="40,10 55,30 40,55 25,30" fill="url(#goldGrad)" stroke="#B8961E" stroke-width="0.5"/>
  <polygon points="40,10 55,30 40,32" fill="#F5D87A" opacity="0.6"/>
  <!-- Texto VILUNA -->
  <text x="65" y="44" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="6" fill="url(#goldGrad)">VILUNA</text>
  <!-- Subtítulo -->
  <text x="65" y="60" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="10" letter-spacing="4" fill="#D4AF37" opacity="0.85">JOYERÍA FINA</text>
  <!-- Línea decorativa -->
  <line x1="65" y1="52" x2="250" y2="52" stroke="#D4AF37" stroke-width="0.5" opacity="0.5"/>
</svg>
